{% set version = "0.2.3" %}

package:
  name: agate-remote
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/a/agate-remote/agate_remote-{{ version }}.tar.gz
  sha256: 8cd995eb6b8b135945e6096d8d683e21ae80f7fbe48330e879cbf0bff65c2827

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python >=3.6
    - pip
  run:
    - python >=3.6
    - agate >=1.5.0
    - requests >=2.9.1

test:
  imports:
    - agateremote

about:
  home: http://agate-remote.readthedocs.org/
  license: MIT
  license_file: COPYING
  license_family: MIT
  # license_file: COPYING - No MANIFEST.in - see https://github.com/wireservice/agate-remote/pull/13
  summary: agate-remote adds read support for remote files to agate.
  doc_url: http://agate-remote.readthedocs.org/
  dev_url: https://github.com/wireservice/agate-remote

extra:
  recipe-maintainers:
    - pmlandwehr
